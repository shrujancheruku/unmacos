# The Settings schema: every Setting UnMacOS understands, and the only place their defaults live.
#
# One [[settings]] entry per Setting, in the order the wizard and the docs show them. A user's
# Answers (~/.config/unmacos/setup.toml) are merged over these defaults by .chezmoi.toml.tmpl,
# the same way for every entry, so templates read the result as .<group>.<key>.
#
# Fields:
#   group, key    where the value lives: Answers table [<group>] and template data .<group>.<key>
#   type          bool | int | enum | string | list
#   default       used when the Answers don't set it
#   min, max      int only: the allowed range
#   choices       enum: the allowed values; list: the allowed items
#   label, help   plain English for the wizard and the generated docs
#   phase         install (asked before anything installs) | tune (changed on the installed desktop)
#   takes_effect  live | apply | restart:<app> | logout
#   env           optional: prefs.sh exports it as this environment variable; a value already in
#                 the environment wins for one run (bool: only exported when true, as 1;
#                 int and enum: always). Not for string or list Settings.
#   ask           optional: ask for it on `chezmoi init` when the Answers don't set it
#   legacy        optional: the flat top-level key today's Answers files use for it. Read until
#                 the migration of old Answers lands, then dropped.
#   feature       optional: the Feature that owns it (filled in by the Features milestone)

# --- Git ---------------------------------------------------------------------------------------

[[settings]]
group = "git"
key = "name"
type = "string"
default = ""
label = "Your name, for git commits"
help = "Goes into ~/.gitconfig. Stays on this Mac."
phase = "install"
takes_effect = "apply"
ask = true
legacy = "name"

[[settings]]
group = "git"
key = "email"
type = "string"
default = ""
label = "Your email, for git commits"
help = "Goes into ~/.gitconfig. Stays on this Mac."
phase = "install"
takes_effect = "apply"
ask = true
legacy = "email"

# --- Look --------------------------------------------------------------------------------------

[[settings]]
group = "look"
key = "theme"
type = "enum"
default = "tokyo-night"
choices = [
  "catppuccin", "catppuccin-latte", "ethereal", "everforest", "flexoki-light", "gruvbox",
  "hackerman", "jade-horse", "kanagawa", "last-horizon", "lumon", "lupine", "matte-black",
  "miasma", "nord", "retro-82", "ristretto", "rose-pine", "solitude", "starship",
  "tokyo-night", "vantablack", "white",
]
label = "Theme"
help = "The colours of the whole desktop. Switch any time with Alt + Ctrl + Shift + Space."
phase = "install"
takes_effect = "live"
legacy = "theme"

[[settings]]
group = "look"
key = "corner_radius"
type = "int"
default = 8
min = 0
max = 24
label = "Corner radius"
help = "Roundness of windows, bar chips, popups and Spotify, in pixels. Apps pick it up when they restart."
phase = "tune"
takes_effect = "apply"
env = "UNMACOS_CORNER_RADIUS"
legacy = "corner_radius"

# --- Bar ---------------------------------------------------------------------------------------

[[settings]]
group = "bar"
key = "weather"
type = "string"
default = "auto"
label = "Weather place"
help = "A city, airport code or zip for the bar's weather, or auto to use your IP address."
phase = "tune"
takes_effect = "live"
legacy = "weather"

# --- Apps --------------------------------------------------------------------------------------

[[settings]]
group = "apps"
key = "groups"
type = "list"
default = []
choices = ["dev", "apps", "media", "games", "appstore"]
label = "Extra apps to install"
help = "Optional app groups (brew/<group>.Brewfile). The desktop and terminal tools are always installed."
phase = "install"
takes_effect = "apply"
legacy = "apps"

[[settings]]
group = "apps"
key = "skip"
type = "list"
default = []
label = "Apps to leave out"
help = "Apps in the chosen groups that should not be installed, by name."
phase = "install"
takes_effect = "apply"
legacy = "apps_skip"

# --- 1Password ---------------------------------------------------------------------------------

[[settings]]
group = "onepassword"
key = "enabled"
type = "bool"
default = false
label = "Read secrets from 1Password"
help = "For spotify_player's client ID. Needs the 1Password app and its CLI integration."
phase = "install"
takes_effect = "apply"
ask = true
legacy = "use_1password"

[[settings]]
group = "onepassword"
key = "spotify_client_id_ref"
type = "string"
default = "op://Private/spotify-player/client_id"
label = "Spotify client ID in 1Password"
help = "The 1Password reference spotify_player reads its client ID from. Only used when 1Password is on."
phase = "tune"
takes_effect = "apply"

# --- Windows and pointer (Rift) ------------------------------------------------------------------

[[settings]]
group = "desktop"
key = "animate"
type = "bool"
default = true
label = "Animate windows into place"
help = "Windows glide to their new spot instead of jumping."
phase = "tune"
takes_effect = "restart:rift"

[[settings]]
group = "desktop"
key = "focus_follows_mouse"
type = "bool"
default = true
label = "Focus follows the mouse"
help = "The window under the pointer takes focus without a click."
phase = "tune"
takes_effect = "restart:rift"

[[settings]]
group = "desktop"
key = "mouse_follows_focus"
type = "bool"
default = true
label = "Pointer follows keyboard focus"
help = "Move the pointer to the window you focus with the keyboard."
phase = "tune"
takes_effect = "restart:rift"

[[settings]]
group = "desktop"
key = "mouse_hides_on_focus"
type = "bool"
default = true
label = "Hide the pointer after a keyboard focus"
help = "Hide the pointer after that until you move the mouse."
phase = "tune"
takes_effect = "restart:rift"

# --- What UnMacOS changes (true = leave it as it is) ---------------------------------------------

[[settings]]
group = "keep"
key = "ai"
type = "bool"
default = false
label = "Keep Apple Intelligence on"
help = "UnMacOS turns Apple Intelligence off (macOS 26+). Set to true to leave it as it is."
phase = "install"
takes_effect = "apply"
env = "UNMACOS_KEEP_AI"

[[settings]]
group = "keep"
key = "glass"
type = "bool"
default = false
label = "Keep Liquid Glass on"
help = "UnMacOS turns Liquid Glass off (macOS 26+). Set to true to leave it as it is."
phase = "install"
takes_effect = "logout"
env = "UNMACOS_KEEP_GLASS"

[[settings]]
group = "keep"
key = "wallpaper"
type = "bool"
default = false
label = "Keep my wallpaper"
help = "UnMacOS sets the desktop wallpaper from the theme. Set to true to leave it as it is."
phase = "install"
takes_effect = "live"
env = "UNMACOS_KEEP_WALLPAPER"

[[settings]]
group = "keep"
key = "accent"
type = "bool"
default = false
label = "Keep macOS's accent colours"
help = "UnMacOS sets macOS's accent and highlight colours from the theme. Set to true to leave them."
phase = "install"
takes_effect = "live"
env = "UNMACOS_KEEP_ACCENT"

[[settings]]
group = "keep"
key = "firefox"
type = "bool"
default = false
label = "Keep Firefox as it is"
help = "UnMacOS themes Firefox with Pywalfox and Dark Reader. Set to true to leave it alone."
phase = "install"
takes_effect = "apply"
env = "UNMACOS_KEEP_FIREFOX"

[[settings]]
group = "keep"
key = "firefox_wallpaper"
type = "bool"
default = false
label = "Keep Firefox's new tab page"
help = "UnMacOS shows the theme's wallpaper on Firefox's new tab page. Set to true to leave it alone."
phase = "install"
takes_effect = "apply"
env = "UNMACOS_KEEP_FIREFOX_WALLPAPER"

[[settings]]
group = "keep"
key = "spotify"
type = "bool"
default = false
label = "Keep Spotify as it is"
help = "UnMacOS themes the Spotify app with Spicetify (media apps). Set to true to leave it alone."
phase = "install"
takes_effect = "apply"
env = "UNMACOS_KEEP_SPOTIFY"

[[settings]]
group = "keep"
key = "orca"
type = "bool"
default = false
label = "Keep Orca's colours"
help = "UnMacOS recolours Orca to match the theme, if you use it. Set to true to leave it alone."
phase = "install"
takes_effect = "live"
env = "UNMACOS_KEEP_ORCA"
