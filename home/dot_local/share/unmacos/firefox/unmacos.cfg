// UnMacOS: live new tab wallpaper and Pywalfox's palette template (Firefox
// autoconfig; the first line is skipped). Installed into Firefox.app by
// unmacos-firefox-wallpaper, with defaults/pref/unmacos-autoconfig.js
// pointing Firefox at it.
//
// Firefox only reads its wallpaper prefs at startup, so on a theme switch
// unmacos-firefox-wallpaper saves the new image under a new name and writes
// <profile>/unmacos-wallpaper.json: {"uuid": "<that name>", "theme": "dark"}.
// This checks that file every 2 seconds and sets the prefs, and the new tab
// page reacts to them live: new image, and the right text colour.
// Pywalfox: its default palette template colours the toolbar and URL bar by
// brightening color0 (slots 16 and 18), far lighter than the theme. Once per
// start this points the background slots at the theme's own surfaces (see
// unmacos-theme-render) and reloads Pywalfox to apply it. A template edited in
// Pywalfox's settings is left alone; "Reset" there brings this back.
// How it went: about:config > unmacos.pywalfox.
// Undo: delete both files (Firefox.app/Contents/Resources/unmacos.cfg and
// defaults/pref/unmacos-autoconfig.js); a Firefox update may also remove them.
try {
  const { classes: Cc, interfaces: Ci } = Components;
  const S = typeof Services !== "undefined" ? Services
    : ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
  const PREF = "browser.newtabpage.activity-stream.newtabWallpapers.";
  let file = null;
  let seen = 0;

  const read = f => {
    const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    fis.init(f, -1, 0, 0);
    const sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
    sis.init(fis);
    const text = sis.read(sis.available());
    sis.close();
    return text;
  };

  // Pywalfox's stock background slots, and ours, per theme mode
  const PYWALFOX = "pywalfox@frewacom.org";
  const STOCK = {
    dark: { background: 0, backgroundLight: 16, backgroundExtra: 18 },
    light: { background: 19, backgroundLight: 17, backgroundExtra: 7 },
  };
  const OURS = {
    dark: { background: 8, backgroundLight: 0, backgroundExtra: 7 },
    light: { background: 8, backgroundLight: 15, backgroundExtra: 7 },
  };
  const isSlots = (palette, slots) => Object.keys(slots).every(k => palette[k] === slots[k]);
  let pywalfox = "todo"; // then "busy", "done"

  // Why it stopped (or is waiting), in about:config as unmacos.pywalfox
  const status = text => S.prefs.setStringPref("unmacos.pywalfox", text);

  // true when finished (or nothing to do), false to try again on the next tick
  const fixPywalfox = async () => {
    // (WebExtensionPolicy isn't defined in autoconfig's scope)
    const { ExtensionParent } =
      ChromeUtils.importESModule("resource://gre/modules/ExtensionParent.sys.mjs");
    const extension = ExtensionParent.GlobalManager.getExtension(PYWALFOX);
    if (!extension || !extension.policy || !extension.policy.active)
      return status("waiting: not running"), false;
    const { ExtensionStorageIDB } =
      ChromeUtils.importESModule("resource://gre/modules/ExtensionStorageIDB.sys.mjs");
    if (!ExtensionStorageIDB.isMigratedExtension(extension)) return status("waiting: storage not migrated"), false;
    const db = await ExtensionStorageIDB.open(ExtensionStorageIDB.getStoragePrincipal(extension));
    const { theme } = await db.get(["theme"]);
    const templates = theme && theme.templates;
    if (!templates || !templates.dark || !templates.light) return status("waiting: no settings saved"), false;
    let changed = false;
    for (const mode of ["dark", "light"]) {
      const palette = templates[mode].palette;
      if (palette && isSlots(palette, STOCK[mode])) {
        Object.assign(palette, OURS[mode]);
        changed = true;
      }
    }
    if (!changed) return status("ok: template already set or edited"), true;
    await db.set({ theme });
    // Pywalfox reads its settings at start: reload it to apply the template
    const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
    const addon = await AddonManager.getAddonByID(PYWALFOX);
    if (addon) await addon.reload();
    return status("ok: template set"), true;
  };

  const check = () => {
    if (pywalfox === "todo") {
      pywalfox = "busy";
      fixPywalfox().then(
        done => { pywalfox = done ? "done" : "todo"; },
        e => {
          pywalfox = "done";
          try { status("error: " + e); } catch (_) {}
          Components.utils.reportError("unmacos.cfg: pywalfox: " + e);
        });
    }
    try {
      if (!file) {
        file = S.dirsvc.get("ProfD", Ci.nsIFile);
        file.append("unmacos-wallpaper.json");
      }
      if (!file.exists()) return;
      const mtime = file.lastModifiedTime;
      if (mtime === seen) return;
      seen = mtime;
      const want = JSON.parse(read(file));
      if (!/^v1-custom-(dark|light)-[a-z]+-[1-9][0-9]*-[0-9a-f-]{36}$/.test(want.uuid || "")) return;
      const theme = want.theme === "light" ? "light" : "dark";
      if (S.prefs.getStringPref(PREF + "customWallpaper.theme", "") !== theme)
        S.prefs.setStringPref(PREF + "customWallpaper.theme", theme);
      if (S.prefs.getStringPref(PREF + "wallpaper", "") !== "custom")
        S.prefs.setStringPref(PREF + "wallpaper", "custom");
      // Last: the new tab page swaps the image when this one changes
      if (S.prefs.getStringPref(PREF + "customWallpaper.uuid", "") !== want.uuid)
        S.prefs.setStringPref(PREF + "customWallpaper.uuid", want.uuid);
    } catch (e) {
      Components.utils.reportError("unmacos.cfg: " + e);
    }
  };

  // Kept on a global so the timer isn't garbage collected
  this.unmacosWallpaperTimer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  this.unmacosWallpaperTimer.initWithCallback({ notify: check }, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
} catch (e) {
  Components.utils.reportError("unmacos.cfg: " + e);
}
