# UnMacOS theme: Tokyo Night
# Omarchy-compatible palette keys. Templates in ../../templates read these as
# {{ key }} (#rrggbb), {{ key_strip }} (rrggbb) and {{ key_rgb }} (r,g,b).
# Files in this directory named like a template output (e.g. ghostty.conf)
# replace the rendered template, so a theme can ship hand-tuned app configs.
mode = "dark"
accent = "#7aa2f7"
selection = "#414868"
muted = "#565f89"
border_inactive = "#3b4261"
bar_border = "#292e42"
background = "#1a1b26"
dark_background = "#16161e"
darker_background = "#1f2335"
lighter_background = "#24283b"
foreground = "#c0caf5"
dark_foreground = "#a9b1d6"
light_foreground = "#c0caf5"
bright_foreground = "#c0caf5"
red = "#f7768e"
yellow = "#e0af68"
orange = "#ff9e64"
green = "#9ece6a"
cyan = "#7dcfff"
blue = "#7aa2f7"
magenta = "#bb9af7"
brown = "#db4b4b"
bright_red = "#f7768e"
bright_yellow = "#e0af68"
bright_green = "#9ece6a"
bright_cyan = "#7dcfff"
bright_blue = "#7aa2f7"
bright_magenta = "#bb9af7"
