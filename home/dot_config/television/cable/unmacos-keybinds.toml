# UnMacOS picker, used by unmacos-menu keybinds
[metadata]
name = "unmacos-keybinds"
description = "Rift keybindings"

[source]
command = '''sed -n "/^\[keys\]/,/^\[binding_modes/p" "$HOME/.config/rift/config.toml" | grep "^\"" | sed -E "s/^\"([^\"]+)\" *= *(.*)$/\1\t\1	\2/" | awk -F"\t" '{printf "%s\t%-26s %s\n", $1, $2, $3}''''
display = "{split:\\t:1}"
output = "{split:\\t:0}"
