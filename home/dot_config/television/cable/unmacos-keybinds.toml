# UnMacOS picker, used by unmacos-menu keybinds and "/" in unmacos-keys
[metadata]
name = "unmacos-keybinds"
description = "Keyboard shortcuts"

[source]
command = '''unmacos-keys --list | awk -F"\t" '{printf "%s\t%-28s %s   · %s\n", $2, $2, $3, $1}' '''
display = "{split:\\t:1}"
output = "{split:\\t:0}"
