# UnMacOS: spotify_player theme. It uses the terminal's ANSI colors (no hex,
# no background), so it follows Ghostty's palette. unmacos-theme-render
# reloads Ghostty, so spotify_player recolors live without a restart
# (spotify_player only reads theme.toml at startup).
[[themes]]
name = "UnMacOS"

[themes.component_style]
block_title = { fg = "Magenta", modifiers = ["Bold"] }
border = { fg = "BrightBlack" }
playback_status = { fg = "Green", modifiers = ["Bold"] }
playback_track = { fg = "BrightWhite", modifiers = ["Bold"] }
playback_artists = { fg = "Magenta", modifiers = ["Bold"] }
playback_album = { fg = "Yellow" }
playback_metadata = { fg = "BrightBlack" }
playback_progress_bar = { fg = "Blue", bg = "BrightBlack" }
current_playing = { fg = "Green", modifiers = ["Bold"] }
page_desc = { fg = "Cyan", modifiers = ["Bold"] }
playlist_desc = { fg = "BrightBlack" }
table_header = { fg = "Red", modifiers = ["Bold"] }
selection = { bg = "BrightBlack", modifiers = ["Bold"] }
