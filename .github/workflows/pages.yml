name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "home/dot_local/share/unmacos/themes/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "home/dot_local/share/unmacos/themes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR runs are cancelled; a deploy to main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version shown in the footer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python3 site/build.py
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
      - name: Check links
        run: python3 site/check.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  lighthouse:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 site/build.py
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: site/lighthouserc.json
          uploadArtifacts: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test the live site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" themes/ keys/ install/ compare/ sitemap.xml robots.txt og.png style.css site.js themes.js; do
            for try in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}${path}")
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$code ${SITE}${path}"
            [ "$code" = 200 ] || exit 1
          done
